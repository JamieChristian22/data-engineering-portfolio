name: Bug report
description: Report a reproducible pipeline, transformation, validation, or documentation issue
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic or public example data. Do not include credentials, private datasets, or sensitive personal information. Use SECURITY.md for private security reporting.
  - type: input
    id: component
    attributes:
      label: Affected project or component
      placeholder: "Project folder, Python script, SQL query, dbt model, or documentation page"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and any non-sensitive sample input needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
      description: Remove private records, secrets, and account details from logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and versions
      placeholder: "OS, Python, dbt, SQL engine, library versions"
    validations:
      required: false
