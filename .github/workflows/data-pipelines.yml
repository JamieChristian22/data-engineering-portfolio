name: Offline data engineering pipelines

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pipelines:
    name: Run six pipelines and verify evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Bash and Python syntax
        run: |
          bash -n run_demo_all.sh
          python -m compileall -q projects shared scripts tests
      - name: Run all offline pipelines
        run: bash run_demo_all.sh
      - name: Verify generated output contracts
        run: python scripts/verify_outputs.py --output demo/latest-run.json
      - name: Run regression tests
        run: python -m pytest -q
      - name: Upload run evidence and interactive explorer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-pipeline-offline-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            demo/pipeline-explorer.html
            demo/latest-run.json
            projects/DE02_IoT_Telemetry_MicroBatch_DuckDB/outputs/etl_run_log.json
            projects/DE03_CDC_Simulation_SQLite_to_Postgres/outputs/replication_report.json
            projects/DE04_Data_Quality_Observability_Reports/outputs/quality_report.json
            projects/DE04_Data_Quality_Observability_Reports/outputs/quality_report.html
            projects/AI01_Document_Ingestion_Vector_Index/outputs/search_results.json
            projects/AI02_Churn_Feature_Pipeline_Training_Monitoring/outputs/drift_report.json
            projects/AI03_Transaction_Anomaly_Scoring_Pipeline/outputs/pipeline_monitor_report.json

  secrets:
    name: Gitleaks secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and SHA256-verify Gitleaks
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Check git history for exposed secrets
        run: /tmp/gitleaks git --no-banner --redact .
